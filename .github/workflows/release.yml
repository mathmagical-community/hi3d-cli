name: release
# Releases are driven by the version in packages/hi3d-cli/package.json — nobody pushes tags by hand.
#   develop + version X.Y.Z-rc.N  → tag vX.Y.Z-rc.N, GitHub pre-release, npm dist-tag `next`
#   main    + version X.Y.Z       → tag vX.Y.Z, GitHub release, npm `latest`
# A push whose version already has a tag does nothing. npm publish needs either npm Trusted Publishing (OIDC, register
# this repo + release.yml in the package settings) or an NPM_TOKEN secret; with neither, the run stays green and prints
# a warning with the manual command instead of failing.
on:
  push:
    branches: [main, develop]
    paths: ['packages/hi3d-cli/package.json']
  workflow_dispatch:

concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - name: decide what (if anything) to release
        id: plan
        run: |
          node scripts/check-version.mjs
          VER=$(node -p "require('./packages/hi3d-cli/package.json').version")
          TAG="v$VER"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to release"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$VER" == *-* ]]; then
            [[ "$GITHUB_REF_NAME" == "develop" || "$GITHUB_REF_NAME" == "main" ]] || { echo "::error::pre-release versions are released from develop (or main), not $GITHUB_REF_NAME"; exit 1; }
            echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "stable version $VER is released from main only; nothing to do on $GITHUB_REF_NAME (develop is synced to main after a release)"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "version=$VER" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.skip == 'false'
        run: npm ci
      - if: steps.plan.outputs.skip == 'false'
        run: npm run build && npm test
      - if: steps.plan.outputs.skip == 'false'
        run: npm run release
        env:
          NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME || '@hi3d/hi3d-cli' }}
          HI3D_WEB_CONSTANTS_JSON: ${{ secrets.HI3D_WEB_CONSTANTS_JSON }}
      - if: steps.plan.outputs.skip == 'false'
        run: cd release && npm pack ./hi3d-cli
      - name: create the tag
        if: steps.plan.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.plan.outputs.tag }}" -m "hi3d-cli ${{ steps.plan.outputs.version }}"
          git push origin "${{ steps.plan.outputs.tag }}"
      - name: GitHub Release with the packed tarball
        if: steps.plan.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          files: 'release/*.tgz'
          generate_release_notes: true
          prerelease: ${{ steps.plan.outputs.prerelease == 'true' }}
      - name: npm publish (OIDC → NPM_TOKEN → skip with a warning)
        if: steps.plan.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
        run: |
          set +e
          NAME=$(node -p "require('./release/hi3d-cli/package.json').name")
          VER=${{ steps.plan.outputs.version }}
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on npm"; echo "### npm: $NAME@$VER already published" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npm install -g npm@latest >/dev/null 2>&1
          cd release/hi3d-cli
          if npm publish --access public --provenance --tag "$NPM_TAG"; then
            echo "### npm: published $NAME@$VER as \`$NPM_TAG\` (Trusted Publishing)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            if npm publish --access public --tag "$NPM_TAG"; then
              echo "### npm: published $NAME@$VER as \`$NPM_TAG\` (NPM_TOKEN)" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          fi
          echo "::warning::npm publish skipped: no Trusted Publisher registered for this repo and no NPM_TOKEN secret. Publish manually: download the tarball from the GitHub Release and run: npm publish <tgz> --access public --tag $NPM_TAG"
          echo "### npm: NOT published — register Trusted Publishing (npm package settings → $GITHUB_REPOSITORY / release.yml) or add an NPM_TOKEN secret. Manual: \`npm publish hi3d-hi3d-cli-$VER.tgz --access public --tag $NPM_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          exit 0
