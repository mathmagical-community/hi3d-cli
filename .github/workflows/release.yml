name: release
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build && npm test
      - run: npm run release
        env:
          # optional: bake site constants for `--mode web` into the published bundle
          HI3D_WEB_CONSTANTS_JSON: ${{ secrets.HI3D_WEB_CONSTANTS_JSON }}
      - run: cd release/hi3d-cli && npm publish --access public --provenance
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      - run: cd release && npm pack ./hi3d-cli
      - uses: softprops/action-gh-release@v2
        with: { files: 'release/hi3d-cli-*.tgz', generate_release_notes: true }
