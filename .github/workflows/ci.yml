name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run release

  smoke:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run build
      - run: npm run release
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs --version
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs tool_list
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs login --mode ak --ak test-ak --sk test-sk --no-verify
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs status
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs blender status
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node test/blender-protocol.mjs

  blender-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
      - run: npm ci && npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.hi3d/blender/envs
          key: bpy-5.2-${{ runner.os }}-${{ hashFiles('packages/blender/src/matrix.ts') }}
      - run: node packages/cli/dist/main.js blender setup --bpy 5.2 --quiet
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node packages/cli/dist/main.js blender status
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: REQUIRE_BLENDER=1 npm run test:blender
