name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run release

  smoke:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run build
      - run: npm run release
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs --version
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs tool_list
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs login --mode ak --ak test-ak --sk test-sk --no-verify
        env: { HI3D_NO_UPDATE_CHECK: '1' }
      - run: node release/hi3d-cli/bin/hi3d-cli.mjs status
        env: { HI3D_NO_UPDATE_CHECK: '1' }
